[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.2.0"
description = "Shared, Postgres-backed persistent memory service for AI agents (API-first)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
# Stdlib only — the client surface (CLI + MCP + urllib ApiClient) has no runtime
# dependencies, by design (portability + fast CLI cold-start).
dependencies = []

[project.optional-dependencies]
# The API service — the only surface that touches the database. Async FastAPI +
# SQLAlchemy 2.0 (asyncpg) + Alembic. The client surface stays stdlib-only (rule #3).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
# The MCP server. Optional, like [server] — keeps the client stdlib-only.
mcp = ["mcp>=1.0"]
# Test-only. Pulls the server + mcp extras + httpx for the ASGI test client.
dev = ["pytest", "pytest-asyncio", "httpx", "coverage[toml]", "agent-memory[server]", "agent-memory[mcp]"]

[project.urls]
Homepage = "https://github.com/kdop/agent-memory"

# `memory-cli` command name preserved (rule #5) — now an entry point onto the
# package instead of a verbatim script file (Ticket A). The repo-root `memory-cli`
# shim and the `memory` alias keep working for source checkouts.
[project.scripts]
memory-cli = "agent_memory.cli:main"
# Convenience entry point for registering the MCP server (needs the [mcp] extra).
agent-memory-mcp = "agent_memory.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the src-layout package importable in-process (drivers build the app)
# without requiring an editable install first.
pythonpath = ["src"]
# Async tests (SQLAlchemy async engine / httpx AsyncClient) — no per-test decorator.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agent_memory"]
# parallel so the in-process pytest data and the CLI-subprocess data (CliDriver
# runs the CLI under `coverage run` when AGENT_MEMORY_COV is set) combine cleanly.
parallel = true
# The uvicorn launcher runs only via `python -m agent_memory.server` in production;
# Alembic migration scripts run under the alembic CLI, not pytest. Omit both rather
# than let untestable glue drag the number.
omit = ["*/server/__main__.py", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == .__main__.:']

[tool.setuptools.packages.find]
where = ["src"]
