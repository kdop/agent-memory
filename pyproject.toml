[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Shared, SQLite-backed persistent memory system for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Stdlib only — no runtime dependencies, by design (portability across agent hosts).
dependencies = []

[project.optional-dependencies]
# The HTTP service (Ticket B). Client surface (CLI / urllib ApiStore) stays
# stdlib-only — only this extra pulls deps, scoping rule #3 to the client.
server = ["fastapi>=0.110", "uvicorn>=0.29"]
# The MCP server (Ticket D). Optional, like [server] — keeps the client stdlib-only.
mcp = ["mcp>=1.0"]
# The PostgreSQL backend (Ticket F). Optional; selected when the DB target is a
# postgresql:// DSN. SQLite stays the default and needs no deps.
postgres = ["psycopg[binary]>=3.1"]
# Test-only. Pulls all surface extras (the drivers run them in-process) + httpx for
# the TestClient. Never part of the shipped client surface.
dev = ["pytest", "httpx", "agent-memory[server]", "agent-memory[mcp]", "agent-memory[postgres]"]

[project.urls]
Homepage = "https://github.com/kdop/agent-memory"

# `memory-cli` command name preserved (rule #5) — now an entry point onto the
# package instead of a verbatim script file (Ticket A). The repo-root `memory-cli`
# shim and the `memory` alias keep working for source checkouts.
[project.scripts]
memory-cli = "agent_memory.cli:main"
# Convenience entry point for registering the MCP server (needs the [mcp] extra).
agent-memory-mcp = "agent_memory.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the src-layout package importable in-process (ApiDriver builds the app)
# without requiring an editable install first.
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
