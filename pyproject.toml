[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Shared, SQLite-backed persistent memory system for AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# Stdlib only — no runtime dependencies, by design (portability across agent hosts).
dependencies = []

[project.optional-dependencies]
# Test-only — never part of the shipped client surface (keeps the stdlib-only rule
# scoped to runtime). The cross-surface suite runs via plain parametrized pytest.
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/kdop/agent-memory"

# `memory-cli` command name preserved (rule #5) — now an entry point onto the
# package instead of a verbatim script file (Ticket A). The repo-root `memory-cli`
# shim and the `memory` alias keep working for source checkouts.
[project.scripts]
memory-cli = "agent_memory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
