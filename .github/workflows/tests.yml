name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres service backs the `pg` cross-surface tests (Ticket F). Without
    # AGENT_MEMORY_TEST_PG_DSN those tests skip; here it's always present.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: memtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Single version — the tool targets one supported Python (pyproject: >=3.14).
          python-version: "3.14"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install test deps
        run: python -m pip install -e ".[dev]"
      - name: Run the test script
        env:
          AGENT_MEMORY_TEST_PG_DSN: postgresql://postgres:dev@localhost:5432/memtest
        # scripts/test.sh is the single source of truth for "does this project
        # work" (pytest + frontend build + a live end-to-end smoke) — the exact
        # same script a developer runs by hand.
        run: ./scripts/test.sh

  # Coverage number on every run (job summary); badge committed only on push to main.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: memtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test deps
        run: python -m pip install -e ".[dev]"
      - name: Measure coverage (CLI subprocess + Postgres included)
        env:
          AGENT_MEMORY_COV: "1"
          AGENT_MEMORY_TEST_PG_DSN: postgresql://postgres:dev@localhost:5432/memtest
        run: |
          coverage run --parallel-mode -m pytest -q
          coverage combine
          coverage report
          {
            echo "### Coverage: $(coverage report --format=total)%"
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if the PR lowers coverage
        if: github.event_name == 'pull_request'
        run: |
          pr=$(printf '%.0f' "$(coverage report --format=total)")
          # Baseline = the coverage % committed in the badge on the target branch.
          # Missing badge (first coverage PR) -> baseline 0, so nothing is ever blocked.
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base=$(git show "origin/${{ github.base_ref }}:coverage.svg" 2>/dev/null \
                 | grep -oE 'coverage: [0-9]+%' | grep -oE '[0-9]+' || echo 0)
          echo "### Coverage gate: base ${base}% → PR ${pr}%" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pr" -lt "$base" ]; then
            echo "::error::Coverage dropped from ${base}% to ${pr}% — merge blocked by the coverage gate."
            exit 1
          fi
          echo "Coverage gate OK (${pr}% ≥ ${base}%)."
      - name: Update badge on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python scripts/coverage_badge.py -o coverage.svg
          if ! git diff --quiet -- coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add coverage.svg
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
