name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Min, mid, latest of the supported range (pyproject: requires-python >=3.10).
        # 3.8/3.9 dropped: EOL, and the Phase 2 server extra targets pydantic v2 (>=3.9)
        # while the test harness uses PEP 604 unions evaluated at runtime (3.10+).
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v
