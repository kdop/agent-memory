name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres service backs the `pg` cross-surface tests (Ticket F). Without
    # AGENT_MEMORY_TEST_PG_DSN those tests skip; here it's always present.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: memtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # Min, mid, latest of the supported range (pyproject: requires-python >=3.10).
        # 3.8/3.9 dropped: EOL, and the Phase 2 server extra targets pydantic v2 (>=3.9)
        # while the test harness uses PEP 604 unions evaluated at runtime (3.10+).
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          AGENT_MEMORY_TEST_PG_DSN: postgresql://postgres:dev@localhost:5432/memtest
        run: python -m pytest -v
