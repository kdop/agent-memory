name: plugin-version

# The memory skill ships as a Claude Code plugin, and `claude plugin update`
# only sees a new version number, not new file contents. The pre-commit hook in
# .githooks/ bumps it locally; this check catches a change that slipped past it.

on:
  pull_request:
    paths: ["skills/**", ".claude-plugin/**"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require a version bump when the plugin changes
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          old=$(git show "origin/${{ github.base_ref }}:.claude-plugin/plugin.json" | jq -r .version)
          new=$(jq -r .version .claude-plugin/plugin.json)
          echo "base $old -> PR $new"
          if [ "$old" = "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::The plugin changed but \"version\" did not. Bump it (or enable the pre-commit hook: git config core.hooksPath .githooks)."
            exit 1
          fi
